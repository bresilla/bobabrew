# Bobabrew build configuration.
# The tea runtime is multi-threaded (input reader, command workers, render
# loop), so threads must be on for the whole package.
--threads:on
# ARC, not ORC: messages cross thread boundaries via the Mailbox (lock + move,
# so a given object is only ever owned by one thread at a time). ORC's cycle
# collector keeps a per-thread cycle registry that is not safe for refs that
# migrate between threads; our messages are acyclic, so ARC is both correct and
# faster here. See docs/PLAN.md §8 / §12.
--mm:arc
